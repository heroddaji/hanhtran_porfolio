  <text x="1176" y="28" font-size="13" fill="#fbefe6" text-anchor="end">Demo – placeholder</text>
  <rect y="44" width="1200" height="40" fill="#fbefe6"/>
  <g font-size="13" fill="#8a3a12" font-weight="500">
