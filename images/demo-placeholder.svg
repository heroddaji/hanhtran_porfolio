    <rect x="858" y="540" width="150" height="80" rx="10" fill="#fbefe6" stroke="#f1d3bd"/>
    <text x="874" y="566">EBIT margin</text><text x="874" y="600" font-size="22" font-weight="700" fill="#8a3a12">18.7%</text>
